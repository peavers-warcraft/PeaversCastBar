apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: PeaversCastBar
  description: "An ultra-lightweight World of Warcraft cast bar addon. Replaces the default cast bars for player, target, focus and pet in ~80 KB with no bundled libraries, costs one widget call a frame while casting and nothing when idle, and can match its width and position to Blizzard's Cooldown Manager."
  annotations:
    github.com/project-slug: peavers-warcraft/PeaversCastBar
spec:
  type: library
  lifecycle: production
  owner: peavers-warcraft
